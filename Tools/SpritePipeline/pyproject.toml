[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-generation-harness"
version = "0.1.0"
description = "Deterministic pixel sprite generation, QA, review, and export harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11.0,<13",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
ui = ["gradio>=6.26,<7"]
dev = ["pytest>=8,<10"]

[project.scripts]
sprite-harness = "sprite_pipeline.cli:main"

[tool.setuptools]
packages = ["sprite_pipeline", "sprite_pipeline.providers", "sprite_pipeline.processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
